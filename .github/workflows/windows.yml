name: Build Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write   # OIDC login to Azure when signing secrets are present
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Signing is optional: when the three AZURE_* secrets exist, electron-builder signs the app, the uninstaller
      # and the installer through Azure Trusted Signing (win.azureSignOptions). Without them the build is unsigned.
      - name: Azure login (Trusted Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      - name: Enable signing in the build config
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.build.win.azureSignOptions = { publisherName: process.env.SIGN_PUBLISHER, endpoint: process.env.SIGN_ENDPOINT, codeSigningAccountName: process.env.SIGN_ACCOUNT, certificateProfileName: process.env.SIGN_PROFILE };
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2));'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SIGN_PUBLISHER: ${{ vars.SIGN_PUBLISHER }}
          SIGN_ENDPOINT: ${{ vars.SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.SIGN_PROFILE }}

      - run: npx electron-builder --win nsis --x64 --publish never
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: BeamUp-Setup
          path: dist/*.exe

      # Microsoft Store package (.appx, unsigned — the Store signs it). Identity comes from Partner Center
      # (Product identity page) through repo variables; placeholders are used until they are set.
      - name: Apply Store identity
        if: ${{ vars.STORE_IDENTITY_NAME != '' }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.build.appx.identityName = process.env.STORE_IDENTITY_NAME;
            p.build.appx.publisher = process.env.STORE_PUBLISHER;
            p.build.appx.publisherDisplayName = process.env.STORE_PUBLISHER_DISPLAY;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2));'
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY: ${{ vars.STORE_PUBLISHER_DISPLAY }}
      - run: npx electron-builder --win appx --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BeamUp-Store
          path: dist/*.appx
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.appx
